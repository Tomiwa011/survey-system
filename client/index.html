<!doctype html>
<html lang="en">
  <head>
    <style>
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9fafb;
    transition: opacity 0.3s ease;
  }
  #preloader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #preloader .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #d1d5db;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: preloader-spin 0.8s linear infinite;
  }
  @keyframes preloader-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #preloader .spinner { animation-duration: 2.4s; }
  }
</style>
